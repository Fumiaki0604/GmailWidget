appId: com.gmail-widget.app
productName: GmailWidget
directories:
  output: dist-app
files:
  - dist/**/*
  - src/renderer/**/*
  - package.json
extraResources:
  - from: src/credentials.json
    to: credentials.json
    filter:
      - "**/*"
win:
  target:
    - target: zip
      arch:
        - x64
