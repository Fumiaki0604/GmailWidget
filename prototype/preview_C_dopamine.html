<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>案C: ドーパミン</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111108;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    gap: 12px;
  }
  .label { color: #555; font-size: 12px; letter-spacing: 1px; }
  .widget {
    width: 380px;
    background: #1a1200;
    border: 2px solid #2a1e00;
    border-radius: 6px;
    overflow: hidden;
  }
  .top-bar {
    background: #ff6b00;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .top-bar-icon { font-size: 16px; }
  .top-bar-text { color: #fff; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }
  .body { padding: 28px 24px; }
  .headline {
    color: #ffffff;
    font-size: 26px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .headline span { color: #ff6b00; }
  .subline {
    color: #666;
    font-size: 13px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .section-label {
    color: #ff6b00;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .account-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
  .account-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #221800;
    border: 2px solid transparent;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .account-item:hover { border-color: #ff6b00; }
  .account-item.selected { border-color: #ff6b00; background: #2d2000; }
  .check {
    width: 18px; height: 18px;
    border-radius: 2px;
    border: 2px solid #444;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: bold;
    color: transparent;
  }
  .account-item.selected .check { border-color: #ff6b00; background: #ff6b00; color: #fff; }
  .account-name { color: #fff; font-size: 14px; font-weight: 700; }
  .account-email { color: #888; font-size: 12px; }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: #ff6b00;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s;
    animation: pulse 2s infinite;
  }
  .login-btn:hover { background: #ff8533; animation: none; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,0,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(255,107,0,0); }
  }
  .note { color: #444; font-size: 11px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
  <div class="label">案C — ドーパミン</div>
  <div class="widget">
    <div class="top-bar">
      <span class="top-bar-icon">📧</span>
      <span class="top-bar-text">GMAIL WIDGET — 重要メール監視中</span>
    </div>
    <div class="body">
      <div class="headline">重要メールを<br><span>見逃すな。</span></div>
      <div class="subline">AIがリアルタイムで仕分け。<br>本当に大切なメールだけ届く。</div>
      <div class="section-label">アカウントを選択</div>
      <div class="account-list">
        <div class="account-item selected" onclick="select(this)">
          <div class="check">✓</div>
          <div>
            <div class="account-name">佐藤 史渉</div>
            <div class="account-email">fumiaki@gmail.com</div>
          </div>
        </div>
        <div class="account-item" onclick="select(this)">
          <div class="check">✓</div>
          <div>
            <div class="account-name">佐藤 史渉（仕事用）</div>
            <div class="account-email">sato@ecbeing.co.jp</div>
          </div>
        </div>
      </div>
      <button class="login-btn" type="button">▶ Googleでサインイン</button>
      <div class="note">※ プロトタイプ — 実際の認証は行いません</div>
    </div>
  </div>
  <script>
    function select(el) {
      document.querySelectorAll('.account-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
